name: cancel-stale-runs

# One-shot helper: the agent sandbox cannot cancel runs (gh returns 403 for the
# Actions API), but a workflow with actions:write can. These two runs are the
# large-v3 attempts that the faster large-v3-turbo run replaces; leaving them
# running would eat the account's ~20 concurrent-job budget.
on:
  push:
    paths:
      - '.github/workflows/cancel-stale-runs.yml'

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: cancel stale large-v3 runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          for id in 36849725540 36853784051; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" -i 2>&1 | head -3 || true
          done
          sleep 20
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=5" \
            -q '.workflow_runs[] | "\(.id) \(.name) \(.status)/\(.conclusion // "-")"' || true
