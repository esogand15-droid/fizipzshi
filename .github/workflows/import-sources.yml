name: import-sources

# The sandbox that authors this جزوه can only reach github.com, so the raw
# lecture archive (PowerPoint decks + PDFs, ~1.7 GB) is fetched here instead.
# The job keeps the heavy material OUT of git: only the inventory is committed,
# while the slides/PDFs themselves travel back as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      url:
        description: direct download URL of the source archive
        required: false
        type: string
  # only workflows living on the default branch can be dispatched by name, so
  # the session branch kicks this off by committing the URL into REQUEST.txt
  push:
    branches:
      - arena/ff8acb52-fizipzshi
    paths:
      - 'work/sources/REQUEST.txt'

permissions:
  contents: write

env:
  BRANCH: arena/ff8acb52-fizipzshi

jobs:
  import:
    if: github.ref_name == 'arena/ff8acb52-fizipzshi'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ff8acb52-fizipzshi
          fetch-depth: 1

      - name: setup
        run: |
          mkdir -p /tmp/diag
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar rsync || true
          sudo apt-get install -y -qq p7zip-rar || echo "p7zip-rar unavailable" >> /tmp/diag/notes.txt
          python3 -m pip install --quiet pymupdf
          { echo "== tools =="; which 7z 7za unar unrar lsar || true;
            echo "== disk =="; df -h /; } > /tmp/diag/env.txt
          cat /tmp/diag/env.txt

      - name: download archive
        run: |
          mkdir -p /tmp/dl
          URL="${{ inputs.url }}"
          if [ -z "$URL" ]; then URL="$(grep -v '^#' work/sources/REQUEST.txt | head -1 | tr -d '\r\n')"; fi
          echo "fetching: $URL" | tee -a /tmp/diag/download.txt
          BIN="$(echo "$URL" | sed -E 's#(https://[^/]+/[^/]+).*#\1#')"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          # filebin hands out a session cookie on the bin page; without it the
          # file URL answers with an HTML interstitial instead of the archive
          curl -sS -L -c /tmp/dl/jar.txt -A "$UA" -o /tmp/dl/bin.html "$BIN" || true
          curl -L --retry 5 --retry-delay 5 --retry-all-errors \
               -b /tmp/dl/jar.txt -c /tmp/dl/jar.txt -A "$UA" \
               -H "Referer: $BIN" -H "Accept: */*" --compressed \
               -D /tmp/diag/headers.txt -o /tmp/dl/archive.bin "$URL" || true
          { ls -l /tmp/dl; echo "== magic =="; head -c 16 /tmp/dl/archive.bin | od -An -tx1 -c; } \
            | tee -a /tmp/diag/download.txt
          if [ "$(stat -c%s /tmp/dl/archive.bin)" -lt 1000000 ]; then
            echo "== body (small -> not the archive) ==" >> /tmp/diag/download.txt
            head -c 4000 /tmp/dl/archive.bin >> /tmp/diag/download.txt
            echo >> /tmp/diag/download.txt
            echo "== bin page head ==" >> /tmp/diag/download.txt
            head -c 1500 /tmp/dl/bin.html >> /tmp/diag/download.txt
          fi

      - name: list + extract
        id: extract
        continue-on-error: true
        run: |
          mkdir -p /tmp/src work/sources
          lsar /tmp/dl/archive.bin > /tmp/diag/listing_lsar.txt 2>&1 || true
          7z l /tmp/dl/archive.bin > /tmp/diag/listing_7z.txt 2>&1 || true
          tail -5 /tmp/diag/listing_7z.txt
          ok=0
          if unar -q -f -o /tmp/src /tmp/dl/archive.bin > /tmp/diag/unar.log 2>&1; then
            echo "extracted with unar"; ok=1
          else
            tail -20 /tmp/diag/unar.log
            if 7z x -y -o/tmp/src /tmp/dl/archive.bin > /tmp/diag/7z.log 2>&1; then
              echo "extracted with 7z"; ok=1
            else
              tail -20 /tmp/diag/7z.log
            fi
          fi
          rm -f /tmp/dl/archive.bin
          { echo "ok=$ok"; du -sh /tmp/src; find /tmp/src -type f | wc -l; } \
            | tee -a /tmp/diag/extract.txt
          find /tmp/src -type f -printf '%10s  %p\n' | sort -k2 > /tmp/diag/files.txt || true
          head -50 /tmp/diag/files.txt
          test "$ok" = "1"

      - name: inventory
        continue-on-error: true
        run: |
          python3 tools/src_inventory.py /tmp/src work/sources/inventory.json \
            | tee /tmp/diag/inventory.txt
          cp -f work/sources/inventory.json /tmp/diag/ || true

      - name: collect documents (no video/audio)
        continue-on-error: true
        run: |
          mkdir -p /tmp/docs
          cd /tmp/src
          find . -type f \( -iname '*.pptx' -o -iname '*.ppt' -o -iname '*.pptm' \
                -o -iname '*.pdf' -o -iname '*.docx' -o -iname '*.doc' \
                -o -iname '*.md' -o -iname '*.txt' -o -iname '*.odp' \) \
            -print0 | rsync -a --files-from=- --from0 ./ /tmp/docs/
          du -sh /tmp/docs | tee -a /tmp/diag/docs.txt
          find /tmp/docs -type f | wc -l | tee -a /tmp/diag/docs.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-diagnostics
          path: /tmp/diag
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-docs
          path: /tmp/docs
          retention-days: 7
          compression-level: 1
          if-no-files-found: ignore

      - name: commit inventory
        if: always()
        run: |
          mkdir -p work/sources/_debug
          cp -f /tmp/diag/*.txt work/sources/_debug/ 2>/dev/null || true
          cp -f /tmp/diag/listing_7z.txt work/sources/ARCHIVE_LISTING.txt 2>/dev/null || true
          cp -f /tmp/diag/files.txt work/sources/ARCHIVE_FILES.txt 2>/dev/null || true
          git config user.name  "humsyar-bot"
          git config user.email "humsyar-bot@users.noreply.github.com"
          git add -A work/sources || true
          git commit -m "sources: inventory of the lecture archive" || exit 0
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
