name: transcribe

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'all | comma separated slugs (e.g. 01,02)'
        default: 'all'
        type: string
      model:
        description: 'faster-whisper model'
        default: 'large-v3'
        type: string
      maxpar:
        description: 'max parallel jobs'
        default: '6'
        type: string
  push:
    paths:
      - '.github/workflows/transcribe.yml'

permissions:
  contents: write

env:
  BRANCH: arena/01a0f6eb-fizipzshi
  REL: sources-v1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f6eb-fizipzshi
          fetch-depth: 1
      - id: m
        run: python3 tools/plan_matrix.py "${{ inputs.slugs || 'all' }}"

  transcribe:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.maxpar || '6') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: w-${{ matrix.slug }}-p${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f6eb-fizipzshi
          fetch-depth: 1

      - name: setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p work/media work/relay
          echo "[$(date -u)] transcribe ${{ matrix.slug }} part ${{ matrix.part }} start" >> work/relay/status.log
          { echo "== pip =="; python3 -m pip install faster-whisper 2>&1 | tail -6;
            echo "== imports ==";
            python3 - <<'PYP'
          import traceback
          try:
              import ctranslate2, faster_whisper
              print("ctranslate2", ctranslate2.__version__)
              print("faster_whisper ok")
          except Exception:
              traceback.print_exc()
          PYP
          } > "work/relay/setup_${{ matrix.slug }}.log" 2>&1
          tail -20 "work/relay/setup_${{ matrix.slug }}.log"

      - name: cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-${{ inputs.model }}-v1

      - name: download video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$REL" --pattern "${{ matrix.slug }}.mp4" -D work/media --clobber
          ls -la work/media

      - name: transcribe
        run: |
          set -o pipefail
          python3 tools/transcribe_one.py "${{ matrix.slug }}" "work/media/${{ matrix.slug }}.mp4" \
            --model "${{ inputs.model || 'large-v3' }}" --offset-min "${{ matrix.offset }}" --limit-min "${{ matrix.limit }}" \
            2>&1 | tee "work/relay/transcribe_${{ matrix.slug }}.log" | tail -30
        continue-on-error: true

      - name: final push
        if: always()
        run: bash tools/relay_push.sh "transcribe-${{ matrix.slug }}-p${{ matrix.part }}-end"
